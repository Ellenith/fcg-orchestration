# catalogapi-route.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogapi-route
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /jogos
            pathType: Prefix
            backend:
              service:
                name: catalog-api   
                port:
                  number: 80