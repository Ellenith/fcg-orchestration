apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-route
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 80
