# usersapi-route.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usersapi-route
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: users-api     # <- troque pelo nome real do Service K8s
                port:
                  number: 80       # <- troque pela porta real do Service
          - path: /usuarios
            pathType: Prefix
            backend:
              service:
                name: users-api
                port:
                  number: 80