apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: users-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: users-api
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
