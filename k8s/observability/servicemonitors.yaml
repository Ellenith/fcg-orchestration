metadata:
  name: catalog-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: catalog-api
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s