# ============================================================
# docker-compose.yml — FCG Fase 2
# Orquestra todos os microsserviços e o RabbitMQ localmente.
# Uso: docker compose up --build
# ============================================================

services:

  # ── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fcg-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fcg-network

  # ── UsersAPI ─────────────────────────────────────────────
  users-api:
    build:
      context: ../fcg-users-api
      dockerfile: Dockerfile
    container_name: fcg-users-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/users.db
      - Jwt__Secret=fcg-super-secret-key-min-32-chars!!
      - Jwt__Issuer=FCG.UsersAPI
      - Jwt__Audience=FCG.Client
      - Jwt__ExpirationMinutes=60
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Usuario=guest
      - RabbitMQ__Senha=guest
    volumes:
      - users-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  # ── CatalogAPI ───────────────────────────────────────────
  catalog-api:
    build:
      context: ../fcg-catalog-api
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/catalog.db
      - Jwt__Secret=fcg-super-secret-key-min-32-chars!!
      - Jwt__Issuer=FCG.UsersAPI
      - Jwt__Audience=FCG.Client
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Usuario=guest
      - RabbitMQ__Senha=guest
    volumes:
      - catalog-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  # ── PaymentsAPI ──────────────────────────────────────────
  payments-api:
    build:
      context: ../fcg-payments-api
      dockerfile: Dockerfile
    container_name: fcg-payments-api
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Usuario=guest
      - RabbitMQ__Senha=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  # ── NotificationsAPI ─────────────────────────────────────
  notifications-api:
    build:
      context: ../fcg-notifications-api
      dockerfile: Dockerfile
    container_name: fcg-notifications-api
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Usuario=guest
      - RabbitMQ__Senha=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

volumes:
  users-data:
  catalog-data:

networks:
  fcg-network:
    driver: bridge